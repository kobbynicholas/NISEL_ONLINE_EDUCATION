<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NISEL ONLINE EDUCATION | Book a Lesson</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef3f8;
}

.container{
width:90%;
max-width:900px;
margin:40px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

h1{
text-align:center;
color:#003366;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:35px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
font-weight:600;
margin-bottom:8px;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

.subjects{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
margin-top:10px;
}

.subject-item{
background:#f8f9fc;
padding:12px;
border-radius:8px;
border:1px solid #ddd;
}

.subject-item input{
width:auto;
margin-right:8px;
}

.summary{
margin-top:30px;
padding:20px;
background:#f4f9ff;
border-left:5px solid #003366;
border-radius:8px;
}

.summary h3{
margin-bottom:15px;
color:#003366;
}

#selectedSubjects{
margin-bottom:10px;
}

.total{
font-size:22px;
font-weight:bold;
color:#008000;
}

button{
margin-top:25px;
width:100%;
padding:15px;
background:#003366;
color:white;
border:none;
font-size:18px;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0055aa;
}

.note{
margin-top:15px;
font-size:14px;
color:#666;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<h1>NISEL ONLINE EDUCATION</h1>
<p class="subtitle">Online Lesson Booking Form</p>

<form action="#" method="post">

<div class="form-group">
<label>Student Name</label>
<input type="text" name="student_name" required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" name="dob" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" name="phone" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Curriculum</label>
<select name="curriculum" required>
<option value="">Select Curriculum</option>
<option>Cambridge</option>
<option>IB</option>
<option>GES</option>
</select>
</div>

<div class="form-group">
<label>Class / Year / Grade</label>
<input type="text" name="class" placeholder="Example: IGCSE Year 10, Grade 8, SHS 2" required>
</div>

<div class="form-group">

<label>Select Subject(s)</label>

<div class="subjects">

<label class="subject-item">
<input type="hidden" value="Mathematics" class="subject">
Mathematics
</label>

<label class="subject-item">
<input type="hidden" value="English Language" class="subject">
English Language
</label>

<label class="subject-item">
<input type="hidden" value="Physics" class="subject">
Physics
</label>

<label class="subject-item">
<input type="checkbox" value="Chemistry" class="subject">
Chemistry
</label>

<label class="subject-item">
<input type="checkbox" value="Biology" class="subject">
Biology
</label>

<label class="subject-item">
<input type="checkbox" value="ICT" class="subject">
ICT
</label>

<label class="subject-item">
<input type="checkbox" value="Economics" class="subject">
Economics
</label>

<label class="subject-item">
<input type="checkbox" value="Business Studies" class="subject">
Business Studies
</label>

<label class="subject-item">
<input type="checkbox" value="Accounting" class="subject">
Accounting
</label>

</div>

</div>

<div class="summary">

<h3>Booking Summary</h3>

<p id="selectedSubjects">No subject selected.</p>

<p class="total">
Total Fee: GHC <span id="total">0</span>
</p>

</div>

<button type="submit">
Proceed to Payment
</button>

<p class="note">
Each subject costs <strong>GHC 1,000</strong>.
</p>

</form>

</div>

<script>

const pricePerSubject = 1000;

const checkboxes = document.querySelectorAll('.subject');

const total = document.getElementById('total');

const selected = document.getElementById('selectedSubjects');

function calculate(){

let subjects=[];

checkboxes.forEach(box=>{

if(box.checked){

subjects.push(box.value);

}

});

selected.innerHTML = subjects.length ?
"<strong>Selected Subjects:</strong><br>"+subjects.join(", ")
:
"No subject selected.";

total.innerHTML = subjects.length * pricePerSubject;

}

checkboxes.forEach(box=>{

box.addEventListener("change",calculate);

});

</script>

</body>
</html>
